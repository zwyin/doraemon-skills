      - blockquote [ref=e30]:
        - paragraph [ref=e31]:
          - text: 本章回答一个问题：
          - strong [ref=e32]: 这个项目到底是什么？
          - text: 如果你在 60 秒内只能记住三件事，应该记住哪三件？
      - heading "1.1 一句话定位" [level=2] [ref=e33]
      - paragraph [ref=e34]:
        - code [ref=e35]: ruyi-project-walkthrough
        - text: 是一个
        - strong [ref=e36]: Claude Code skill
        - text: （也可以分发到 Cursor / Windsurf / OpenCode / Gemini CLI），它的作用是：
        - strong [ref=e37]: 给任意软件项目 / 研究报告 / 文档集合，自动生成一份分层的技术走读文档
        - text: ，产物是「编号 markdown 章节 + 一个自包含的交互式 HTML」。
      - blockquote [ref=e38]:
        - paragraph [ref=e39]:
          - strong [ref=e40]: 类比理解
          - text: ：想象你被空投到一个陌生城市，手里只有一张地铁图。这个 skill 就像一个本地向导——它会先在城里逛一圈（探索代码），摸清楚哪几条线路最重要（架构分析），然后给你画一张带标注、带路线、带小测验的「城市导览图」（走读文档 + HTML），让你 30 分钟内对这座城市有体系化的认识。
