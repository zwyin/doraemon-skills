      - heading "1.3 它解决什么问题" [level=2] [ref=e114]
      - paragraph [ref=e115]:
        - text: LLM 生成技术文档时有一个顽固的毛病：
        - strong [ref=e116]: 幻觉（hallucination）
        - text: ——它会一本正经地写出根本不存在的文件名、函数签名、版本号。传统的「让它写文档」流程没有刹车机制。
      - paragraph [ref=e117]:
        - text: 这个 skill 的核心立意就是：
        - strong [ref=e118]: 用一套「先验证、后写作」的流程（manifest-first），把 LLM 的幻觉锁死在生成之前
        - text: 。每一个写进文档里的代码块、版本号、目录结构，都必须先在真实源码里验证过、记录在一个
        - code [ref=e119]: sources-manifest.json
        - text: 清单里，才允许落笔。
      - blockquote [ref=e120]:
        - paragraph [ref=e121]:
          - strong [ref=e122]: 类比理解
          - text: ：就像写新闻报道，记者不能凭印象写「据知情人士透露」，每句话都要能指回一个采访录音或文件。这里的
          - code [ref=e123]: sources-manifest.json
          - text: 就是那本「采访录音索引」——文档里每个事实，都能在索引里查到它来自哪个源文件的哪几行。
      - heading "1.4 技术栈" [level=2] [ref=e124]
      - list [ref=e125]:
        - listitem [ref=e126]:
          - strong [ref=e127]: 主体
          - text: ：Markdown（
          - code [ref=e128]: SKILL.md
          - text: 本身就是「用自然语言编写的工作流程序」，890 行）
        - listitem [ref=e129]:
          - strong [ref=e130]: 重活脚本
          - text: ：Python 3（无第三方运行时依赖，转换器、验证器、依赖图都是标准库实现）
        - listitem [ref=e131]:
          - strong [ref=e132]: 分发/发版
          - text: ：Bash（
          - code [ref=e133]: convert.sh
          - text: 跨平台生成、
          - code [ref=e134]: release.sh
          - text: 版本同步）
        - listitem [ref=e135]:
          - strong [ref=e136]: 唯一可选依赖
          - text: ：
          - code [ref=e137]: jsonschema
          - text: （验证器用它做 schema 校验；缺失则降级跳过，不阻塞）
        - listitem [ref=e138]:
          - strong [ref=e139]: 交付物
          - text: ：自包含 HTML（零外部依赖，纯
          - code [ref=e140]: file://
          - text: 可打开）
      - heading "1.5 四个值得记住的设计决策（预告）" [level=2] [ref=e141]
      - paragraph [ref=e142]: 这四点会在后续章节展开，这里先给个全景：
      - list [ref=e143]:
        - listitem [ref=e144]:
          - strong [ref=e145]: Converter-first HTML
          - text: （第 3 章）：用 Python
          - strong [ref=e146]: 预渲染
          - text: 静态 HTML，而不是在浏览器里用
          - code [ref=e147]: innerHTML
          - text: 动态拼。这从根上避免了「打开是空白页」的经典坑。
        - listitem [ref=e148]:
          - strong [ref=e149]: Manifest-first 准确性
          - text: （第 4 章）：先验证后写，manifest 是「写作许可证」而非「审计日志」。
        - listitem [ref=e150]:
          - strong [ref=e151]: 六阶段流水线 + 硬交付门禁
          - text: （第 5 章）：Phase 5 必须读到
          - code [ref=e152]: verify-result.json
          - text: 的
          - code [ref=e153]: "passed: true"
          - text: 才算完成，禁止虚构指标。
        - listitem [ref=e154]:
          - strong [ref=e155]: 源码依赖图驱动架构图
          - text: （第 8 章）：架构图的每一根箭头都来自
          - code [ref=e156]: import_graph.py
          - text: 提取的真实 import，不靠目录结构瞎猜。
