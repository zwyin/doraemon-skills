      - blockquote [ref=e162]:
        - paragraph [ref=e163]:
          - text: 本章回答：
          - strong [ref=e164]: markdown 里的 quiz 题怎么变成 HTML 里能点的高亮交互？又为什么曾经所有题的「正确答案」都塌成 A？
      - heading "7.1 quiz 从 markdown 到 HTML 的旅程" [level=2] [ref=e165]
      - paragraph [ref=e166]:
        - text: walkthrough 每个深度级别的最后一章必须含一个
        - code [ref=e167]: "## Quiz"
        - text: 段。Phase 4 转换时，
        - code [ref=e168]: md_to_html.py
        - text: 把这段单独抽出来，解析成结构化数据，再渲染成可点击的交互组件：
      - code [ref=e170]: "# Simplified from: scripts/md_to_html.py:223-276 (parse_quiz_md 核心，节选) def parse_quiz_md(quiz_md): questions = [] parts = re.split(r'\\*\\*Q\\d+[：:]\\s*\\*\\*\\s*', quiz_md) # 按 **Q1:** 切题 for part in parts[1:]: lines = [l.strip() for l in part.strip().split(\"\\n\") if l.strip()] q_lines, opts, answer, explanation = [], [], \"\", \"\" state = \"question\" for line in lines: opt_match = re.match(r'^(?:[-*]\\s+)?([A-D])[.)]\\s+(.*)', line) # A. 选项 if opt_match and state in (\"question\", \"options\"): state = \"options\"; opts.append(opt_match.group(2)) elif re.match(r'^\\*\\*Answer\\s*[：:]\\s*[A-D]\\s*\\*\\*', line, re.IGNORECASE): m = re.search(r'[：:]\\s*([A-D])\\s*\\*\\*', line, re.IGNORECASE) # 锚定取答案字母 if m: answer = m.group(1).upper() state = \"answer\" elif re.match(r'^\\*\\*Explanation\\s*[：:]', line, re.IGNORECASE): explanation = ...; state = \"explanation\" elif state == \"explanation\": if line.strip() == \"---\": break # --- 是题间分隔，别吞进解释 explanation += \" \" + line elif state == \"question\": q_lines.append(line) if q_lines and opts and answer: correct = ord(answer) - ord('A') # A→0, B→1, C→2, D→3 if 0 <= correct < len(opts): questions.append({\"q\": \" \".join(q_lines), \"o\": opts, \"c\": correct, \"e\": explanation}) return questions"
      - blockquote [ref=e171]:
        - paragraph [ref=e172]:
          - strong [ref=e173]: 这段代码在做什么
          - text: ：用一个小状态机（
          - code [ref=e174]: question → options → answer → explanation
          - text: ）把每道题切成四块：题干
          - code [ref=e175]: q
          - text: 、选项列表
          - code [ref=e176]: o
          - text: 、
          - strong [ref=e177]:
            - text: 正确答案索引
            - code [ref=e178]: c
          - text: 、解释
          - code [ref=e179]: e
          - text: 。关键是
          - code [ref=e180]: c = ord(answer) - ord('A')
          - text: ——把字母 A/B/C/D 换成数字索引 0/1/2/3，HTML 组件靠这个索引判断对错。
      - heading "7.2 渲染：点击高亮 + 解释" [level=2] [ref=e181]
      - paragraph [ref=e182]:
        - code [ref=e183]: build_quiz_section
        - text: 把解析出的题目渲染成一段内联 JS：每题一个卡片，4 个按钮。点对 → 绿色高亮；点错 → 結色高亮 + 自动把正确答案也标绿；下方弹出解释。完全前端交互，无后端。
